version: "3.8"

services:
  clamav:
    image: clamav/clamav:stable
    restart: unless-stopped
    mem_limit: 2g
    cpus: 2.0
    pids_limit: 128

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - SYNOPSIZE_ANTIVIRUS_MODE=required
      - SYNOPSIZE_CLAMD_HOST=clamav
    depends_on:
      - clamav
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 2g
    cpus: 2.0
    volumes:
      - ./backend/storage:/app/storage
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api
    depends_on:
      - backend
    restart: unless-stopped
